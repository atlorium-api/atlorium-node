# Типы, тесты, сборка и проверка экспортов на поддерживаемых версиях Node.js.
# Живой API здесь не вызывается: тесты идут на подменённом fetch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:exports

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Сгенерированный код должен совпадать с тем, что даёт генератор из закоммиченных спек
      # (включая новые файлы, которых нет в репозитории). Генератору зависимости не нужны.
      - name: Generated code is up to date
        run: |
          npm run generate
          if [ -n "$(git status --porcelain -- src/generated)" ]; then
            echo "::error::src/generated не совпадает с выводом генератора: запустите npm run generate и закоммитьте результат"
            git status -- src/generated
            git diff -- src/generated
            exit 1
          fi

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run
